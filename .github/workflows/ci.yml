name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check whitespace and git formatting
        run: git diff --check HEAD~1 2>/dev/null || git diff --check

      - name: Static checks & syntax validation
        run: npm run check

      - name: Run unit & regression test suite
        run: npm test
