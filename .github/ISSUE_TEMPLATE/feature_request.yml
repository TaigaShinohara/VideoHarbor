name: 機能提案 (Feature Request)
description: VideoHarborへの新機能や改善の提案
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        VideoHarborは「Manifest V3準拠」「外部依存ゼロ」「完全ローカル処理」「最小限の権限（activeTab優先）」という設計方針を重視しています。
        提案にあたっては、プライバシーやセキュリティへの影響も考慮していただけると助かります。

  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題・動機
      description: 現在のどのような動作や制約に困っているか、またはどんなユースケースがあるかを教えてください。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 提案する解決策・新機能の内容
      description: どのような機能や動作を希望されるかを具体的に記載してください。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 代替案や検討したこと
      description: 他に検討された手段や、関連するライブラリ・ブラウザAPI等があれば記載してください。
